manifest_version = 1

[package]
name = "shared-browser-app"
version = "0.1.0"
language = "1.0"

[toolchain]
compiler = "1.0.0"
stdlib = "bundled"

[sources]
root = "src"

[targets.app]
entry = "src/cli.wysna"
profile = "native-cli"

[targets.web]
entry = "src/pricing.wysna"
profile = "browser-library"
memory_limit_mb = 32

[targets.service]
entry = "src/service_worker.wysna"
profile = "native-cli"

[[tests]]
name = "shared-pricing-contract"
entry = "tests/pricing.wysna"
timeout_ms = 10000
