manifest_version = 1

[package]
name = "shared-browser-app"
version = "0.1.0"
language = "0.5"

[toolchain]
compiler = "0.5.0"
stdlib = "bundled"

[sources]
root = "src"

[targets.app]
entry = "src/cli.wysna"
profile = "native-cli"

[targets.web]
entry = "src/pricing.wysna"
profile = "browser-library"
memory_limit_mb = 32

[[tests]]
name = "shared-pricing-contract"
entry = "tests/pricing.wysna"
timeout_ms = 10000
