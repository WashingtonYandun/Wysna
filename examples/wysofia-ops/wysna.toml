manifest_version = 1

[package]
name = "wysofia-ops"
version = "0.1.0"
language = "0.9"

[toolchain]
compiler = "0.9.5"
stdlib = "bundled"

[sources]
root = "src"

[targets.app]
entry = "src/main.wysna"
profile = "native-cli"

[targets.sqlite-audit]
entry = "src/sqlite_cli.wysna"
profile = "native-cli"

[targets.ingest]
entry = "src/ingest.wysna"
profile = "native-cli"

[[tests]]
name = "audit-domain-contracts"
entry = "tests/audit_test.wysna"
timeout_ms = 10000
