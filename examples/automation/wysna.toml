manifest_version = 1

[package]
name = "automation-runner"
version = "0.1.0"
language = "0.5"

[toolchain]
compiler = "0.5.0"
stdlib = "bundled"

[sources]
root = "src"

[targets.app]
entry = "src/main.wysna"
profile = "native-cli"

[[tests]]
name = "runner-argv-contract"
entry = "tests/argv.wysna"
timeout_ms = 10000
