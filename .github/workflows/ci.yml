name: Wysna Compiler Integration Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      profile:
        description: "Release rejects every unsupported engine/feature row"
        type: choice
        options: [integration, release]
        default: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  llvm-experimental:
    name: Native LLVM qualification (${{ matrix.os }})
    needs: wheel-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: llvm-wheel
      - name: Install the wheel with the pinned optional LLVM tools
        run: |
          wheel=$(find llvm-wheel -name '*.whl' -print -quit)
          python -m pip install "${wheel}[llvm]"
          python -m pip freeze > llvm-tools.txt
      - name: Install Linux debugger and external library headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lldb libcurl4-openssl-dev libsqlite3-dev
      - name: Verify managed MIR, native execution, sanitizers, caches and source debugging
        run: |
          set -o pipefail
          python -m tests.unit.test_llvm_evidence -v
          python -m tests.unit.test_llvm_backend -v 2>&1 | tee llvm-tests.log
      - name: Verify LLVM compilation outside the source checkout
        run: python tools/validate_llvm_install.py
      - name: Qualify every native corpus case at every optimization profile
        run: python tools/qualify_llvm.py --output .wysna_cache/llvm-qualification
      - name: Repeat the full corpus with program and runtime sanitizers
        run: python tools/qualify_llvm.py --sanitize --output .wysna_cache/llvm-sanitized
      - name: Verify SQLite resources and error recovery through LLVM FFI
        run: python tools/validate_sqlite_ffi.py --llvm --sanitize --rows 1000 --samples 1 --report .wysna_cache/llvm-sqlite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-experimental-${{ matrix.os }}
          path: |
            llvm-tests.log
            llvm-tools.txt
            .wysna_cache/llvm-qualification/
            .wysna_cache/llvm-sanitized/
            .wysna_cache/llvm-sqlite.json
          include-hidden-files: true
          if-no-files-found: error

  llvm-sdk-build:
    name: Build and qualify LLVM SDK (${{ matrix.os }})
    needs: wheel-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: .wysna_cache/llvm-wheel
      - name: Package pinned native LLVM tools, Zig, Seed and licenses
        run: |
          wheel=$(find .wysna_cache/llvm-wheel -name '*.whl' -print -quit)
          python tools/package_llvm_sdk.py --wheel "$wheel" --output .wysna_cache/llvm-sdk --source-commit "$GITHUB_SHA" --archive
          cp tools/validate_llvm_sdk.py .wysna_cache/validate_llvm_sdk.py
      - name: Qualify the native opt and llc provider on the complete corpus
        env:
          WYSNA_LLVM_SDK: ${{ github.workspace }}/.wysna_cache/llvm-sdk
        run: python tools/qualify_llvm.py --output .wysna_cache/llvm-sdk-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-sdk-${{ matrix.os }}
          path: |
            .wysna_cache/llvm-sdk.tar.gz
            .wysna_cache/validate_llvm_sdk.py
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-sdk-qualification-${{ matrix.os }}
          path: |
            .wysna_cache/llvm-sdk-qualification/
            .wysna_cache/llvm-sdk/llvm-sdk.json
          include-hidden-files: true
          if-no-files-found: error

  llvm-comparison:
    name: LLVM comparison (${{ matrix.os }}, ${{ matrix.profile }})
    needs: llvm-sdk-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [dev, release, size]
    env:
      WYSNA_LLVM_SDK: ${{ github.workspace }}/.wysna_cache/llvm-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: llvm-sdk-${{ matrix.os }}
          path: .wysna_cache/llvm-artifact
      - uses: actions/download-artifact@v4
        with:
          name: llvm-sdk-qualification-${{ matrix.os }}
          path: .wysna_cache/llvm-sdk-evidence
      - name: Restore the exact qualified SDK outside its archive
        run: tar -xzf .wysna_cache/llvm-artifact/llvm-sdk.tar.gz -C .wysna_cache
      - name: Measure every workload with the unchanged sample protocol
        run: |
          qualification=$(find .wysna_cache/llvm-sdk-evidence -name summary.json -print -quit)
          python tools/benchmark_llvm.py --qualification "$qualification" --profiles ${{ matrix.profile }} --output .wysna_cache/llvm-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-measurements-${{ matrix.os }}-${{ matrix.profile }}
          path: .wysna_cache/llvm-comparison/**/*.json
          include-hidden-files: true
          if-no-files-found: error

  installed-llvm-sdk:
    name: Installed LLVM SDK (${{ matrix.os }})
    needs: llvm-sdk-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Consumer acceptance deliberately has no source checkout or LLVM Python extra.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: llvm-sdk-${{ matrix.os }}
          path: llvm-artifact
      - name: Accept the read-only SDK with no host compiler or LLVM on PATH
        run: |
          consumer="$RUNNER_TEMP/installed LLVM ü"
          mkdir -p "$consumer"
          tar -xzf llvm-artifact/llvm-sdk.tar.gz -C "$consumer"
          python llvm-artifact/validate_llvm_sdk.py --sdk "$consumer/llvm-sdk" --source-commit "$GITHUB_SHA" --forbid-source "$GITHUB_WORKSPACE" --report installed-llvm-sdk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-llvm-sdk-${{ matrix.os }}
          path: installed-llvm-sdk.json
          if-no-files-found: error

  wheel-build:
    name: Build Wysna wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the versioned wheel and standalone consumer validator
        run: |
          python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0
          python -m build --wheel --no-isolation --outdir dist/wheel
          cp tools/validate_wheel.py dist/wheel/validate_wheel.py
          python -m pip freeze > dist/wheel/build-tools.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wysna-wheel
          path: dist/wheel/
          if-no-files-found: error

  installed-wheel:
    name: Installed Wysna wheel (${{ matrix.os }})
    needs: wheel-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: clang
    steps:
      # Deliberately do not check out sources in the consumer job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: .wysna_cache/installation-wheel
      - name: Verify the installed CLI without checkout access or installed writes
        run: |
          python .wysna_cache/installation-wheel/validate_wheel.py --wheel .wysna_cache/installation-wheel/*.whl --forbid-source "$GITHUB_WORKSPACE" --report installed-wheel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-wheel-${{ matrix.os }}
          path: installed-wheel.json
          if-no-files-found: ignore

  compiler-contracts:
    name: Compiler contracts (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: clang}
          - {os: ubuntu-latest, cc: gcc}
          - {os: macos-latest, cc: clang}
    env:
      CC: ${{ matrix.cc }}
      WYSNA_CI_ARTIFACTS: ${{ github.workspace }}/.wysna_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libcurl development files on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install libcurl development files on macOS
        if: runner.os == 'macOS'
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"
      - name: Install the optional interpreter HTTP adapter
        run: python -m pip install -e '.[http,service]'
      - name: Verify CI harness failure contracts
        run: |
          python3 -m tests.unit.test_ci_harness
          python3 -m tests.unit.test_execution_context
          python3 -m tests.unit.test_hir_return_paths
          python3 -m tests.unit.test_f03_error_unions
          python3 -m tests.unit.test_compilation_session
          python3 -m tests.unit.test_compiler_service
          python3 -m tests.unit.test_effect_analysis
          python3 -m tests.unit.test_architecture_contract
          python3 -m tests.unit.test_native_toolchain
          python3 -m tests.unit.test_expansion_contracts
          python3 -m tests.unit.test_audit_remediation
          python3 -m tests.unit.test_mir
          python3 -m tests.unit.test_selfhost_mir
          python3 -m tests.unit.test_native_mir_pipeline
          python3 -m tests.unit.test_selfhost_compilation_context
          python3 -m tests.unit.test_distribution_contract
          python3 -m tests.unit.test_installers
          python3 -m tests.unit.test_audit_findings
          python3 -m tests.unit.test_standard_toolkit
          python3 -m tests.unit.test_http_client
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage-${{ matrix.os }}-${{ matrix.cc }}
          path: .wysna_cache/ci-artifacts/*.json
          if-no-files-found: ignore
      - name: Preserve failure reproductions and bootstrap C
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-failures-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            .wysna_cache/ci-artifacts/
            .wysna_cache/compiler*.c
            tests/differential/failures/
            tests/fuzz/failures/

  runtime-conformance:
    name: Full runtime conformance (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: clang}
          - {os: ubuntu-latest, cc: gcc}
          - {os: macos-latest, cc: clang}
    env:
      CC: ${{ matrix.cc }}
      WYSNA_CI_ARTIFACTS: ${{ github.workspace }}/.wysna_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libcurl development files on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install libcurl development files on macOS
        if: runner.os == 'macOS'
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"
      - name: Install the optional interpreter HTTP adapter
        run: python -m pip install -e '.[http,service]'
      - name: Verify full conformance and SHA256 bootstrap
        run: |
          mkdir -p .wysna_cache/ci-artifacts
          ./wysna test 2>&1 | tee .wysna_cache/ci-artifacts/conformance.log
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-coverage-${{ matrix.os }}-${{ matrix.cc }}
          path: .wysna_cache/ci-artifacts/
          if-no-files-found: ignore
      - name: Preserve failure reproductions and bootstrap C
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-failures-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            .wysna_cache/ci-artifacts/
            .wysna_cache/compiler*.c
            tests/differential/failures/
            tests/fuzz/failures/

  integration-conformance:
    name: Integration conformance (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: clang}
          - {os: ubuntu-latest, cc: gcc}
          - {os: macos-latest, cc: clang}
    env:
      CC: ${{ matrix.cc }}
      WYSNA_CI_ARTIFACTS: ${{ github.workspace }}/.wysna_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libcurl development files on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install libcurl development files on macOS
        if: runner.os == 'macOS'
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"
      - name: Install the optional interpreter HTTP adapter
        run: python -m pip install -e '.[http,service]'
      - name: Verify runtime, examples and direct selfhost negatives across four engines
        run: python3 tools/ci_conformance.py --profile=${{ inputs.profile || 'release' }}
      - name: Verify four-engine differential and deterministic fuzz corpus
        run: |
          ./wysna test --differential 20 2>&1 | tee .wysna_cache/ci-artifacts/differential.log
          ./wysna test --fuzz 100 2>&1 | tee .wysna_cache/ci-artifacts/fuzz.log
      - name: Install SQLite development headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify the loopback service and SQLite worker pilot
        run: python3 -m tests.unit.test_service_pilot
      - name: Verify service load measurement contracts
        run: python3 -m tests.unit.test_service_measurement
      - name: Verify the browser-library ABI contract
        run: python3 -m tests.unit.test_browser_library
      - name: Verify SQLite FFI against C with sanitizers and persisted data
        run: python3 tools/validate_sqlite_ffi.py --sanitize --report .wysna_cache/ci-artifacts/sqlite-ffi.json
      - name: Verify atomic CSV imports, rollback and process memory against C
        run: python3 tools/validate_sqlite_import.py --sanitize --rows 1000 --samples 1 --report .wysna_cache/ci-artifacts/sqlite-import.json
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.cc }}
          path: .wysna_cache/ci-artifacts/*.json
          if-no-files-found: ignore
      - name: Preserve failure reproductions and bootstrap C
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            .wysna_cache/ci-artifacts/
            .wysna_cache/compiler*.c
            tests/differential/failures/
            tests/fuzz/failures/

  conformance:
    needs: [compiler-contracts, runtime-conformance, integration-conformance, llvm-experimental, installed-llvm-sdk, llvm-comparison, seed-installers, windows-installer]
    if: always()
    name: Conformance (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: clang}
          - {os: ubuntu-latest, cc: gcc}
          - {os: macos-latest, cc: clang}
    steps:
      - name: Require compiler, runtime and integration conformance success
        env:
          CONTRACT_RESULT: ${{ needs.compiler-contracts.result }}
          RUNTIME_RESULT: ${{ needs.runtime-conformance.result }}
          INTEGRATION_RESULT: ${{ needs.integration-conformance.result }}
          LLVM_RESULT: ${{ needs.llvm-experimental.result }}
          LLVM_SDK_RESULT: ${{ needs.installed-llvm-sdk.result }}
          LLVM_COMPARISON_RESULT: ${{ needs.llvm-comparison.result }}
          SEED_INSTALLER_RESULT: ${{ needs.seed-installers.result }}
          WINDOWS_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
        run: |
          if [ "$CONTRACT_RESULT" != "success" ] || [ "$RUNTIME_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ] || [ "$LLVM_RESULT" != "success" ] || [ "$LLVM_SDK_RESULT" != "success" ] || [ "$LLVM_COMPARISON_RESULT" != "success" ] || [ "$SEED_INSTALLER_RESULT" != "success" ] || [ "$WINDOWS_INSTALLER_RESULT" != "success" ]; then
            echo "Prerequisites did not pass: compiler=$CONTRACT_RESULT runtime=$RUNTIME_RESULT integration=$INTEGRATION_RESULT llvm=$LLVM_RESULT sdk=$LLVM_SDK_RESULT comparison=$LLVM_COMPARISON_RESULT" >&2
            exit 1
          fi

  service-load-campaign:
    name: Service load and RSS campaign (Ubuntu)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SQLite development files
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install the optional service adapter
        run: python -m pip install -e '.[service]'
      - name: Run three sustained service repetitions
        run: >-
          python3 tools/measure_service.py --warmup-seconds 60 --duration-seconds 600
          --repetitions 3 --clients 4 --saturation-clients 48 --saturation-seconds 1
          --workers 4 --queue-size 32 --minimum-latency-samples 10000
          --rss-growth-budget-percent 5 --rss-growth-budget-bytes 8388608
          --report .wysna_cache/ci-artifacts/service-load.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-load-rss-campaign
          path: .wysna_cache/ci-artifacts/service-load.json
          if-no-files-found: error

  browser-library:
    name: Browser library (Emscripten 5.0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache
      - name: Install Wysna from the checkout
        run: python -m pip install -e .
      - name: Verify the browser-library ABI contract
        run: python3 -m tests.unit.test_browser_library
      - name: Build the browser-library example
        run: >-
          python3 main.py project build --manifest examples/browser-library/wysna.toml
          --target web --output "$RUNNER_TEMP/wysna-browser/library.mjs"
      - name: Exercise the generated ESM and WebAssembly library
        run: node tests/browser_library_smoke.mjs "$RUNNER_TEMP/wysna-browser/library.mjs"
      - name: Verify shared source across native and browser targets
        run: |
          python3 main.py project check --manifest examples/shared-browser-app/wysna.toml --target app
          python3 main.py project check --manifest examples/shared-browser-app/wysna.toml --target web
          python3 main.py project test --manifest examples/shared-browser-app/wysna.toml
      - name: Build native CLI from shared Wysna source
        run: >-
          python3 main.py project build --manifest examples/shared-browser-app/wysna.toml
          --target app --output "$RUNNER_TEMP/wysna-shared-app/quote"
      - name: Build browser module from shared Wysna source
        run: >-
          python3 main.py project build --manifest examples/shared-browser-app/wysna.toml
          --target web --output "$RUNNER_TEMP/wysna-shared-app/build/pricing.mjs"
      - name: Compare native and WebAssembly results
        run: |
          native_output="$("$RUNNER_TEMP/wysna-shared-app/quote" 3 1299)"
          browser_output="$(node examples/shared-browser-app/tests/shared_browser_app_smoke.mjs "$RUNNER_TEMP/wysna-shared-app/build/pricing.mjs")"
          test "$native_output" = "$browser_output"
      - name: Stage browser application assets
        run: cp -R examples/shared-browser-app/web "$RUNNER_TEMP/wysna-shared-app/web"
      - name: Open the shared application in headless Chrome
        run: python3 examples/shared-browser-app/tests/browser_smoke.py "$RUNNER_TEMP/wysna-shared-app"

  sanitizers:
    name: Memory safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CC: clang
      WYSNA_CI_ARTIFACTS: ${{ github.workspace }}/.wysna_cache/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libcurl development files on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install libcurl development files on macOS
        if: runner.os == 'macOS'
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"
      - name: Install the optional interpreter HTTP adapter
        run: python -m pip install -e '.[http]'
      - name: Verify the full acyclic runtime and example corpus with ASan and UBSan
        # Linux also enables LSan; Darwin does not support leak detection.
        run: python3 tools/ci_conformance.py --sanitize
      - name: Verify targeted ownership, telemetry and isolated strong-cycle evidence
        run: |
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_remediation
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_mir
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_completion
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_readiness
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_compilation_session
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_audit_findings
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_foundations
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_standard_toolkit
          WYSNA_SANITIZE=1 python3 -m tests.unit.test_http_client
          python3 -m tests.unit.test_phase_a
          python3 -m tests.unit.test_ownership_control_flow
          python3 -m tests.unit.test_f03_ownership
          python3 -m tests.unit.test_cow_telemetry
          python3 -m tests.unit.test_weak_references
      - name: Upload memory coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-coverage-${{ matrix.os }}
          path: .wysna_cache/ci-artifacts/*.json
          if-no-files-found: ignore
      - name: Preserve failing sanitizer reproductions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-failures-${{ matrix.os }}
          path: |
            .wysna_cache/ci-artifacts/
            .wysna_cache/compiler*.c

  windows-toolchain:
    name: Windows CLI and native C99 smoke
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CC: clang
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sources and build with portable host adapters
        run: |
          python -m tests.unit.test_distribution_contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py check --stats examples/01_hello_world.wysna
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py build --stats examples/01_hello_world.wysna -o hello.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./hello.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap Wysna Compiler through the Windows cache lock
        run: |
          python main.py build --backend=selfhost tests/runtime/readiness_patterns.wysna -o patterns.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./patterns.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify persistent resources and executable documentation
        run: |
          python -m tests.unit.test_foundations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify standard toolkit and native LSP paths
        run: |
          python -m tests.unit.test_audit_findings 2>&1 | Tee-Object -FilePath audit.log
          if ($LASTEXITCODE -ne 0) {
              $line = Get-Content audit.log | Select-String "AssertionError" | Select-Object -First 1
              if ($line) { Write-Host "::error::$line" } else { Get-Content audit.log -Tail 10 | ForEach-Object { Write-Host "::error::$_" } }
              exit $LASTEXITCODE
          }
          python -m tests.unit.test_standard_toolkit 2>&1 | Tee-Object -FilePath toolkit.log
          if ($LASTEXITCODE -ne 0) {
              $line = Get-Content toolkit.log | Select-String "AssertionError" | Select-Object -First 1
              if ($line) { Write-Host "::error::$line" } else { Get-Content toolkit.log -Tail 10 | ForEach-Object { Write-Host "::error::$_" } }
              exit $LASTEXITCODE
          }
      - name: Upload smoke failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures-windows
          path: |
            audit.log
            toolkit.log
            .wysna_cache/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Package and verify the native SQLite pilot
        run: |
          python tools/package_measurement_pilot.py --output dist/measurement-pilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the tested Windows x64 pilot
        uses: actions/upload-artifact@v4
        with:
          name: measurement-pilot-windows-x64
          path: dist/measurement-pilot/
          if-no-files-found: error

  windows-installer:
    name: Windows standalone installer
    needs: wheel-build
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: .wysna_cache/installation-wheel
      - uses: actions/cache@v4
        with:
          path: .wysna_cache/windows-downloads
          key: windows-runtime-python-3.14.8-zig-0.15.2-v1
      - name: Verify Windows distribution contracts
        run: |
          python -m tests.unit.test_windows_distribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle Wysna with private Python and a complete C toolchain
        run: |
          $wheel = (Get-ChildItem .wysna_cache/installation-wheel/*.whl).FullName
          python tools/package_distribution.py --wheel $wheel --output dist/windows-bundle --cache .wysna_cache/windows-downloads --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the per-user installer
        run: |
          python tools/package_installers.py --bundle dist/windows-bundle --output dist/windows-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 is required on the Windows packaging runner" }
          & $compiler /Q "/DBundleDir=$((Resolve-Path dist/windows-bundle).Path)" "/DWysnaVersion=0.4.99" /DWysnaCompression=none "/DOutputDir=$env:GITHUB_WORKSPACE\dist\upgrade-fixture" packaging/windows/wysna.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test install, native build, repair and uninstall without host dependencies
        run: |
          ./tools/validate_windows_lifecycle.ps1 -Installer (Get-ChildItem dist/windows-installer/*-setup.exe).FullName -UpgradeFrom (Get-ChildItem dist/upgrade-fixture/*-setup.exe).FullName -ReportDirectory "$env:GITHUB_WORKSPACE\dist\windows-reports"
      - name: Archive the portable distribution and calculate checksums
        run: |
          python -c "import shutil; shutil.make_archive('dist/windows-installer/wysna-windows-x64-portable', 'zip', 'dist/windows-bundle')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/windows-installer -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/windows-installer/CHECKSUMS.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wysna-windows-x64-installer
          path: dist/windows-installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-reports
          path: dist/windows-reports/
          if-no-files-found: warn

  seed-installers:
    name: Seed installer lifecycle (${{ matrix.os }})
    needs: wheel-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wysna-wheel
          path: .wysna_cache/installation-wheel
      - uses: actions/cache@v4
        with:
          path: .wysna_cache/installation-downloads
          key: seed-${{ runner.os }}-${{ runner.arch }}-python-20261026-zig-0.15.2-v1
      - name: Install Linux packaging and declared HTTP development inputs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm libcurl4-openssl-dev
          echo "WYSNA_CURL_CONFIG=/usr/bin/curl-config" >> "$GITHUB_ENV"
      - name: Install macOS HTTP development inputs
        if: runner.os == 'macOS'
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"
      - name: Assemble the complete distribution from this clean source commit
        run: |
          wheel=$(find .wysna_cache/installation-wheel -name '*.whl' -print -quit)
          python tools/package_distribution.py --wheel "$wheel" --output dist/seed --source-commit "$GITHUB_SHA"
          python tools/package_installers.py --bundle dist/seed --output dist/installers
      - name: Accept macOS install, repair, upgrade, installed application and uninstall
        if: runner.os == 'macOS'
        run: python tools/validate_unix_lifecycle.py --bundle dist/seed --installer dist/installers/*.pkg --reports dist/reports/macos --http
      - name: Accept Debian install, repair, upgrade, installed application and uninstall
        if: runner.os == 'Linux'
        run: python tools/validate_unix_lifecycle.py --bundle dist/seed --installer dist/installers/*.deb --reports dist/reports/debian --http
      - name: Accept RPM lifecycle inside a disposable Fedora system
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e CI=true -v "$GITHUB_WORKSPACE:/work" -w /work fedora:44 bash -c '
            set -eu
            dnf install -y python3 rpm-build
            python3 tools/validate_unix_lifecycle.py --bundle dist/seed --installer dist/installers/*.rpm --reports dist/reports/fedora
          '
      - uses: actions/upload-artifact@v4
        with:
          name: wysna-seed-installers-${{ runner.os }}-${{ runner.arch }}
          path: dist/installers/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-installer-reports-${{ runner.os }}-${{ runner.arch }}
          path: dist/reports/
          if-no-files-found: warn

  wasi-command:
    name: WASI command target (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify wasi-sdk 34
        run: |
          archive="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz" \
            --output "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install the pinned Wasmtime runner
        run: python -m pip install -e ".[wasi]"
      - name: Build, inspect, compare and execute the WASI command fixture
        run: python -m tests.unit.test_wasi_target

  native-sdk-build:
    name: Build native SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .wysna_cache/native-downloads
          key: native-components-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/native/components.json') }}
      - name: Verify native packaging contracts
        run: python -m tests.unit.test_native_sdk
      - name: Build verified native compiler and pinned offline SDK
        run: |
          mkdir -p dist/native
          python tools/package_native.py --output dist/native/wysna-native --archive --source-commit "$GITHUB_SHA" > dist/native/package-report.json
          cp tools/validate_native_sdk.py dist/native/validate_native_sdk.py
          cp selfhost/compiler.wysna dist/native/compiler.wysna
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-${{ matrix.os }}
          path: |
            dist/native/*.tar.gz
            dist/native/*.zip
            dist/native/validate_native_sdk.py
            dist/native/compiler.wysna
            dist/native/package-report.json
          if-no-files-found: error
      - name: Preserve native bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-sdk-build-failure-${{ matrix.os }}
          path: |
            .wysna_cache/bootstrap/*/bootstrap.json
            .wysna_cache/bootstrap/*/compiler*.c
            dist/native/package-report.json
          if-no-files-found: ignore

  installed-native-sdk:
    name: Installed native SDK (${{ matrix.os }})
    needs: native-sdk-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Python executes the validator only; every SDK child receives an isolated PATH.
      # Deliberately do not check out repository sources in this consumer job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: native-sdk-${{ matrix.os }}
          path: native-artifact
      - name: Extract the platform archive
        run: |
          python -c "from pathlib import Path; import shutil; files=list(Path('native-artifact').glob('*.tar.gz'))+list(Path('native-artifact').glob('*.zip')); assert len(files)==1, files; shutil.unpack_archive(str(files[0]), 'installed')"
      - name: Validate isolated installed workflows and native selfbuild
        run: python native-artifact/validate_native_sdk.py --sdk installed/wysna-native --strict-source --compiler-source native-artifact/compiler.wysna --report native-install-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sdk-acceptance-${{ matrix.os }}
          path: native-install-report.json
          if-no-files-found: error
