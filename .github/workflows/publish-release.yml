name: Publish Wysna release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag on main to publish"
        required: true

permissions: {}

concurrency:
  group: publish-wysna-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish accepted installers
    if: github.ref_name != 'v0.5.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require tagged commit on main with successful main CI and version parity
        id: source-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must match vX.Y.Z: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          head_sha="$(git rev-parse "${tag}^{commit}")"
          declared_version="$(PYTHONPATH=src python3 -c 'from common.Version import WYSNA_VERSION; print(WYSNA_VERSION)')"
          if [ "$declared_version" != "$version" ]; then
            echo "Tag version $version does not match WYSNA_VERSION ($declared_version)" >&2
            exit 1
          fi
          release_notes="docs/release-notes/${tag}.md"
          if [ ! -f "$release_notes" ]; then
            echo "Missing release notes file: $release_notes" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$head_sha" origin/main
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")][0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful main CI run exists for tagged source $head_sha" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "release_notes=$release_notes" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Source commit $head_sha passed main CI run $run_id for $tag"

      - name: Download the accepted Windows installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: wysna-windows-x64-installer
          path: artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-ci.outputs.run_id }}

      - name: Download the accepted macOS installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: wysna-seed-installers-macOS-ARM64
          path: artifacts/macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-ci.outputs.run_id }}

      - name: Download the accepted Linux installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: wysna-seed-installers-Linux-X64
          path: artifacts/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-ci.outputs.run_id }}

      - name: Download native SDK archives and installed acceptance reports
        uses: actions/download-artifact@v4
        with:
          pattern: native-sdk-*
          path: artifacts/native
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-ci.outputs.run_id }}

      - name: Package deterministic VS Code extension (.vsix)
        run: |
          python3 tools/package_vscode.py \
            --output "dist/wysna-${{ steps.source-ci.outputs.version }}-vscode.vsix"

      - name: Validate source, installer manifests and checksums
        run: |
          python3 tools/prepare_release_assets.py \
            --version "${{ steps.source-ci.outputs.version }}" \
            --source-commit "${{ steps.source-ci.outputs.head_sha }}" \
            --ci-run-id "${{ steps.source-ci.outputs.run_id }}" \
            --windows-artifact artifacts/windows \
            --macos-artifact artifacts/macos \
            --linux-artifact artifacts/linux \
            --native-artifacts artifacts/native \
            --vscode-vsix "dist/wysna-${{ steps.source-ci.outputs.version }}-vscode.vsix" \
            --release-notes "${{ steps.source-ci.outputs.release_notes }}" \
            --output dist/release-assets

      - name: Generate Winget and Homebrew package manifests
        run: |
          python3 tools/generate_package_managers.py \
            --version "${{ steps.source-ci.outputs.version }}" \
            --checksums dist/release-assets/SHA256SUMS \
            --output dist/package-managers
          cp dist/package-managers/homebrew/wysna.rb dist/release-assets/wysna.rb
          cp dist/package-managers/winget/WySofia.Wysna*.yaml dist/release-assets/

      - name: Publish and verify the stable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source-ci.outputs.tag }}
          VERSION: ${{ steps.source-ci.outputs.version }}
          HEAD_SHA: ${{ steps.source-ci.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/release-assets/* \
            --title "Wysna ${VERSION}" \
            --notes-file dist/release-notes.md \
            --target "$HEAD_SHA" \
            --verify-tag
          gh release view "$TAG" --json isDraft,isPrerelease,tagName,assets | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          tag = os.environ["TAG"]
          ver = os.environ["VERSION"]
          assert data.get("tagName") == tag, data
          assert not data.get("isDraft"), data
          assert not data.get("isPrerelease"), data
          assets = data.get("assets") or []
          names = {asset["name"] for asset in assets}
          native = {f"wysna-{ver}-native-{platform}.{ext}" for platform, ext in [
              ("aarch64-macos", "tar.gz"), ("x86_64-linux", "tar.gz"), ("x86_64-windows", "zip"),
          ]}
          assert native <= names, f"Missing native release assets: {native - names}"
          extra_expected = {
              f"wysna-{ver}-native-x86_64-windows-setup.exe",
              f"wysna-{ver}-vscode.vsix",
              "wysna.rb",
              "WySofia.Wysna.yaml",
              "WySofia.Wysna.installer.yaml",
              "WySofia.Wysna.locale.en-US.yaml",
          }
          assert extra_expected <= names, f"Missing distribution assets: {extra_expected - names}"
          assert len(assets) >= 19, f"Expected >= 19 verified assets, got {len(assets)}"
          print(f"Published stable Wysna {ver} with {len(assets)} verified assets")
          '

      - name: Notify Wysna Handbook (repository_dispatch & Vercel Deploy Hook)
        continue-on-error: true
        env:
          TAG: ${{ steps.source-ci.outputs.tag }}
          VERSION: ${{ steps.source-ci.outputs.version }}
          HANDBOOK_DISPATCH_TOKEN: ${{ secrets.HANDBOOK_DISPATCH_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          notified=0
          if [ -n "$HANDBOOK_DISPATCH_TOKEN" ]; then
            GH_TOKEN="$HANDBOOK_DISPATCH_TOKEN" gh api repos/WashingtonYandun/wysna-handbook/dispatches \
              -f event_type=wysna-release \
              -f "client_payload[tag]=${TAG}" \
              -f "client_payload[version]=${VERSION}"
            echo "Dispatched wysna-release to WashingtonYandun/wysna-handbook for ${TAG}."
            notified=1
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null
            echo "Triggered Vercel Deploy Hook for ${TAG}."
            notified=1
          fi
          if [ "$notified" -eq 0 ]; then
            echo "Info: Neither HANDBOOK_DISPATCH_TOKEN nor VERCEL_DEPLOY_HOOK_URL is configured; skipping website trigger."
          fi
